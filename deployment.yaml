apiVersion: apps/v1
kind: Deployment
metadata:
  name: mywebapp-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: mywebapp

  template:
    metadata:
      labels:
        app: mywebapp

    spec:
      containers:
      - name: mywebapp
        image: sushzmah/mywebapp:latest
        ports:
        - containerPort: 80
